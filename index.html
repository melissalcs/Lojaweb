<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Store - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
 
<body>
 
    <!-- Cabeçalho Principal -->
    <header>
        <div class="header-container">
            <h1>Style Store</h1>
 
            <nav>
                <a href="index.html" class="active">Início</a>
                <a href="feminina.html">Feminina</a>
                <a href="masculina.html">Masculina</a>
                <a href="infantil.html">Infantil</a>
                <a href="cliente.html">Área do Cliente</a>
                <a href="vendedor.html">Área do Vendedor</a>
            </nav>
        </div>
    </header>
 
    <!-- Conteúdo Principal -->
    <main class="container">
 
        <!-- Banner Carrossel -->
        <section class="carrossel-container"
            onmouseenter="pausarCarrossel()"
            onmouseleave="iniciarCarrosselAuto()">
 
            <div class="carrossel-wrapper" id="carrossel-slides">
                <!-- Slides gerados pelo JavaScript -->
            </div>
 
            <!-- Botões de Navegação -->
            <button class="carrossel-btn btn-prev"
                onclick="mudarSlide(-1)"
                aria-label="Slide Anterior">
                &#10094;
            </button>
 
            <button class="carrossel-btn btn-next"
                onclick="mudarSlide(1)"
                aria-label="Próximo Slide">
                &#10095;
            </button>
 
            <!-- Indicadores -->
            <div class="carrossel-indicadores"
                id="carrossel-indicadores">
            </div>
 
        </section>
 
        <!-- Produtos em Destaque -->
        <section>
            <h2 class="titulo-secao">Destaques da Loja</h2>
 
            <div id="grid-destaques" class="grid-produtos">
            </div>
        </section>
 
    </main>
 
    <!-- Botão Flutuante do Carrinho -->
    <div class="carrinho-flutuante"
        onclick="abrirModalCarrinho()">
 
        🛒 Carrinho
        <span id="carrinho-qtd">0</span>
 
    </div>
 
    <!-- Modal do Carrinho -->
    <div id="modal-carrinho" class="modal">
 
        <div class="modal-content">
 
            <div class="modal-header">
                <h2>Seu Carrinho de Compras</h2>
 
                <span class="fechar"
                    onclick="fecharModalCarrinho()">
                    &times;
                </span>
            </div>
 
            <div id="carrinho-itens" class="carrinho-corpo">
            </div>
 
            <div class="carrinho-rodape">
 
                <h3>
                    Total: R$
                    <span id="carrinho-total">0.00</span>
                </h3>
 
                <button class="btn-primary"
                    onclick="finalizarCompra()">
                    Finalizar Compra
                </button>
 
            </div>
 
        </div>
 
    </div>
 
    <!-- Rodapé -->
    <footer>
        <p>
            &copy; 2026 StyleStore - Projeto aula Front-End
            (HTML, CSS, JS)
        </p>
    </footer>
 
    <!-- JavaScript Principal -->
    <script src="js/main.js"></script>
 
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            iniciarCarrosselBanners();
            renderizarDestaques();
        });
    </script>
 
</body>
</html>
